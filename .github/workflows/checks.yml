name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Syntax check
        run: node --check build/src/7*.js build/src/8*.js build/src/9*.js

      - name: Artifact is rebuilt from its sources
        run: |
          cd build && node build.js
          git diff --exit-code --stat -- ../dist/Digital_Communications.html

      - name: Numerical checks
        working-directory: verify
        run: |
          python verify_scenes.py
          python verify_drills.py
          python verify_ber.py

      - name: Text rules
        run: |
          python tools/rule_check.py "build/src/8[1-9]_scenes*.js" "build/src/9[2-8]_drill_m*.js" "build/src/91_*.js" "build/src/70_labs.js" "build/src/7[1-9]_labs*.js" "notes/src/*.js"
